name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
    - name: Set up Go 1.25
      uses: actions/setup-go@v6
      with:
        go-version: 1.25
        cache: true
      id: go

    - name: Check out code
      uses: actions/checkout@v5

    - name: Get dependencies
      run: go mod download

    - name: Run the tests
      run: go test -v ./...

    - name: Actually building
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        OUTPUT_NAME=bin/comicbookcollector-${{ matrix.goos }}-${{ matrix.goarch }}

        go build -v -o $OUTPUT_NAME ./cmd/scraper

    - name: Upload Artifact
      uses: actions/upload-artifact@v6
      with:
        name: comicbookcollector-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/comicbookcollector-*
        # Set retention to keep artifacts clean
        retention-days: 5
