name: Building...
on: [push]
jobs:

  build:
    name: Build all
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.25
      uses: actions/setup-go@v6
      with:
        go-version: 1.25
      id: go

    - name: Check out code
      uses: actions/checkout@v5

    - name: Actually building
      run: go build -v ./...
