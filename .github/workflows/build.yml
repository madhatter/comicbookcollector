name: Build and Test
on: 
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:

    - name: Set up Go 1.25
      uses: actions/setup-go@v6
      with:
        go-version: 1.25
        cache: true
      id: go

    - name: Check out code
      uses: actions/checkout@v5

    - name: Get dependencies
      run: go mod download

    - name: Run the tests
      run: go test -v ./...

    - name: Actually building
      run: go build -v -o bin/comicbookcollector ./cmd/scraper

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: comicbookcollector-linux-amd64
        path: bin/comicbookcollector
        # Set retention to keep artifacts clean
        retention-days: 5
