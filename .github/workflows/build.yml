name: Build and Test
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    steps:
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25
        cache: true

    - name: Checkout code
      uses: actions/checkout@v5
    
    - name: Get dependencies
      run: go mod download
    
    - name: Run Tests
      run: go test -v ./...
    
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]

    steps:
    - name: Set up Go 1.25
      uses: actions/setup-go@v6
      with:
        go-version: 1.25
        cache: true
      id: go

    - name: Check out code
      uses: actions/checkout@v5

    - name: Get dependencies
      run: go mod download

    - name: Building
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
        CGO_ENABLED: 0
      run: |
        OUTPUT_NAME=bin/comicbookcollector-${{ matrix.goos }}-${{ matrix.goarch }}

        go build -v -o $OUTPUT_NAME ./cmd/scraper

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: comicbookcollector-${{ matrix.goos }}-${{ matrix.goarch }}
        path: bin/comicbookcollector-*
        # Set retention to keep artifacts clean
        retention-days: 5
